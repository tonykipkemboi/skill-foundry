name: Skill Policy
on:
  pull_request:
    paths: ['skills/**', 'dist/**', '.github/workflows/**', 'shared-tool-reference.md']
permissions:
  contents: read
  pull-requests: write
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # The template uses its own composite action via the local path, so repos
      # created from it are self-contained. (Advanced: point this at a central,
      # SHA-pinned copy -- uses: YOUR-ORG/skill-foundry/.github/actions/lint-skills@<sha>
      # -- so policy improvements propagate by bumping one SHA.)
      - uses: ./.github/actions/lint-skills
