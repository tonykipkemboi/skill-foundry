name: Test Action
on:
  pull_request:
    paths: ['.github/scripts/**', 'tests/**', '.github/actions/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install gitleaks and yq
        run: |
          cd /tmp
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gl.tgz
          tar xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/
          sudo curl -sSL https://github.com/mikefarah/yq/releases/download/v4.53.2/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Run fixture harness
        run: bash tests/run-tests.sh
